  <line x1="42" y1="44" x2="58" y2="44" stroke="#FFFBEB" stroke-width="1.8" stroke-linecap="round" />
  <line x1="40" y1="47" x2="60" y2="47" stroke="#FFFBEB" stroke-width="1.8" stroke-linecap="round" />
  <line x1="43" y1="50" x2="57" y2="50" stroke="#FFFBEB" stroke-width="1.8" stroke-linecap="round" />
  <path d="M50 42 L53 48 L50 52 L47 48 Z" fill="#DC2626" stroke="#FEF08A" stroke-width="0.8" />

