  <path d="M68 42 C84 36, 87 50, 81 61 C77 67, 70 65, 66 59 Z" fill="url(#ganapathiSkinGrad)" stroke="#B45309" stroke-width="1.8" />
  <path d="M28 46 C20 44, 19 53, 23 58" stroke="#D97706" stroke-width="1.4" stroke-linecap="round" />
  <path d="M72 46 C80 44, 81 53, 77 58" stroke="#D97706" stroke-width="1.4" stroke-linecap="round" />

