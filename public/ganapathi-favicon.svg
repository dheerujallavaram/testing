  <circle cx="50" cy="27" r="3.4" fill="#E11D48" stroke="#FEF08A" stroke-width="1" />
  <rect x="31" y="35" width="38" height="5" rx="2.5" fill="#F59E0B" stroke="#FEF08A" stroke-width="1.2" />

  <!-- Lord Ganapathi Face & Curved Trunk (Vakratunda) -->
  <path d="M33 40 C33 38, 67 38, 67 40 C69 51, 65 60, 58 64 C56 71, 58 76, 63 75 C67 74, 68 70, 65 68 C63 67, 64 64, 67 65 C72 67, 73 74, 67 79 C60 83, 47 81, 44 71 C43 67, 42 63, 41 61 C35 58, 31 50, 33 40 Z" fill="url(#ganapathiSkinGrad)" stroke="#92400E" stroke-width="1.8" />

