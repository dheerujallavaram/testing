    </linearGradient>
    <linearGradient id="ganapathiSkinGrad" x1="20" y1="35" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Outer Sacred Golden Halo Circle -->
  <circle cx="50" cy="50" r="47.5" fill="url(#ganapathiBgGrad)" stroke="url(#goldRimGrad)" stroke-width="4" />

