name: Daily Night 12:00 AM IST Telegram & WhatsApp Panchangam + 4 HD Videos Automation

on:
  schedule:
    # Runs every day at 18:30 UTC (Night 12:00 AM / 00:00 IST)
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows manual 1-click test from GitHub Actions tab

jobs:
  send-whatsapp-panchangam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg for 1080p HD Video Generation
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate & Send Today's Panchangam + 4 HD Videos to Telegram, WhatsApp, YouTube Shorts & Social
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }} # e.g. 918977986166
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }} # Optional free personal WhatsApp API key
          META_WA_TOKEN: ${{ secrets.META_WA_TOKEN }} # Optional Meta WhatsApp Cloud API token
          META_PHONE_ID: ${{ secrets.META_PHONE_ID }} # Optional Meta Phone Number ID
          SAVE_DAILY_REELS_DIR: output/daily-reels
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
          REEL_PUBLISH_VARIANTS: ${{ secrets.REEL_PUBLISH_VARIANTS }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          SOCIAL_WEBHOOK_URL: ${{ secrets.SOCIAL_WEBHOOK_URL }}
        run: npx tsx scripts/sendDailyPanchangam.ts

      - name: Save 4 Daily 1080p HD Reels as Downloadable Artifact (7 Days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-panchangam-rashi-reels-1080p
          path: output/daily-reels/
          retention-days: 7
          if-no-files-found: ignore
