name: Daily Night 12:00 AM IST Telegram & WhatsApp Panchangam + 4 HD Videos Automation

on:
  schedule:
    # Runs every day at 18:30 UTC (Night 12:00 AM / 00:00 IST)
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows manual 1-click test from GitHub Actions tab

jobs:
  send-whatsapp-panchangam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg for 1080p HD Video Generation
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate & Send Today's Panchangam Image & 12 Rashi Predictions to Telegram & WhatsApp
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }} # e.g. 918977986166
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }} # Optional free personal WhatsApp API key
          META_WA_TOKEN: ${{ secrets.META_WA_TOKEN }} # Optional Meta WhatsApp Cloud API token
          META_PHONE_ID: ${{ secrets.META_PHONE_ID }} # Optional Meta Phone Number ID
        run: npx tsx scripts/sendDailyPanchangam.ts
